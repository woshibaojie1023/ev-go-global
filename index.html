<!DOCTYPE html>
<!--
  新能源车出海市场决策助手 v3 · 情报指挥台 / 编辑部简报
  设计系统：DESIGN.md（纸底 #F5F1E8 + 墨蓝 #101D2E + 翡翠玉 #0E8F6C，衬线标题 + 点阵世界地图）
  结构：顶栏 / 三栏指挥台（榜单 · 点阵地图 · 国家简报）/ 底部来源条
  零运行时依赖：纯 HTML + 内联 CSS + 原生 JS + Canvas 2D，无网络请求。
  加载顺序：landmask.js → data.js → i18n.js → app.js
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101D2E">
<title>新能源车出海市场决策助手</title>
<link rel="stylesheet" href="style.css?v=3.3">
</head>
<body data-tab="rank">

  <!-- ══════════ 顶栏（深墨蓝） ══════════ -->
  <header class="topbar">
    <div class="brand">
      <h1 class="app-title" id="appTitle"></h1>
      <p class="app-sub" id="appSubtitle"></p>
    </div>
    <span class="topbar-spacer"></span>
    <div class="asof" id="dataAsOf"></div>
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language"></div>
    <div class="export-group" id="exportGroup">
      <button class="tb-btn" id="btnPrint" type="button">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 6V2h8v4M4 13H2.5A1.5 1.5 0 0 1 1 11.5v-4A1.5 1.5 0 0 1 2.5 6h11a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5H12M4 10h8v4H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span id="btnPrintLabel"></span>
      </button>
      <button class="tb-btn" id="btnCsv" type="button">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 2v8m0 0L5 7m3 3 3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="btnCsvLabel"></span>
      </button>
      <button class="tb-btn" id="btnCopy" type="button">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span id="btnCopyLabel"></span>
      </button>
    </div>
  </header>

  <!-- ══════════ 指挥台三栏 ══════════ -->
  <main class="console" id="console">

    <!-- 移动端 Tab 切换（<1080px 显示） -->
    <nav class="mobile-tabs" id="mobileTabs" aria-label="tabs">
      <button type="button" class="mtab is-active" data-tab="rank" id="tabRank"></button>
      <button type="button" class="mtab" data-tab="brief" id="tabBrief"></button>
    </nav>

    <!-- 左栏：搜索 + 组织筛选 + 排名榜单 + 长尾抽屉 -->
    <aside class="rail rail-left" id="railLeft" aria-label="rank">
      <div class="search-box">
        <svg class="search-ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" type="button" aria-label="clear" hidden>
          <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="chip-row" id="chipRow" role="group" aria-label="blocs"></div>

      <div class="rail-label" id="rankLabel"></div>
      <div class="rank-list" id="rankList" role="listbox" aria-label="ranking"></div>
      <div class="no-result" id="noResult" hidden></div>

      <button class="tail-toggle" id="tailToggle" type="button" aria-expanded="false">
        <span id="tailToggleLabel"></span>
        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tail-drawer" id="tailDrawer" hidden>
        <div class="tail-list" id="tailList"></div>
      </div>
    </aside>

    <!-- 中栏：点阵世界地图（签名区） -->
    <section class="map-stage" id="mapStage">
      <div class="map-head">
        <span class="map-title" id="mapTitle"></span>
        <span class="map-hint" id="mapHint"></span>
      </div>
      <div class="map-canvas-wrap" id="mapWrap">
        <canvas id="dotmap" role="img" tabindex="0" aria-label="world map"></canvas>
        <div class="map-tooltip" id="mapTooltip" hidden></div>
      </div>
      <div class="map-legend" id="mapLegend"></div>
      <div class="sr-only" id="liveRegion" aria-live="polite"></div>
    </section>

    <!-- 右栏：国家简报 -->
    <aside class="rail rail-right" id="railRight" aria-label="briefing">
      <div id="briefing" class="briefing"></div>
    </aside>
  </main>

  <!-- ══════════ 底部：来源 / 诚实声明 / 可行性 ══════════ -->
  <footer class="site-footer" id="siteFooter">
    <div class="footer-row footer-details">
      <details class="footer-detail" id="sourcesDetails">
        <summary id="sourcesTitle"></summary>
        <p id="footerSources" class="sources-list"></p>
      </details>
      <details class="footer-detail" id="honestDetails">
        <summary id="honestTitle"></summary>
        <p id="honestBody"></p>
        <p class="fallback-note" id="fallbackNote"></p>
      </details>
    </div>
  </footer>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 打印报告（屏幕隐藏，打印时输出） -->
  <div id="printReport" class="print-report" aria-hidden="true"></div>

  <script src="landmask.js?v=3.3"></script>
  <script src="data.js?v=3.3"></script>
  <script src="i18n.js?v=3.3"></script>
  <script src="app.js?v=3.3"></script>
</body>
</html>
